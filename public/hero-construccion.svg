<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ciudad en construcción al atardecer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16222F"/>
      <stop offset="0.55" stop-color="#1B2A3A"/>
      <stop offset="1" stop-color="#22344A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#84CC16" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#84CC16" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bldA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3D52"/>
      <stop offset="1" stop-color="#1C2C3D"/>
    </linearGradient>
    <linearGradient id="bldB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#223346"/>
      <stop offset="1" stop-color="#172534"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="600" fill="url(#sky)"/>
  <rect y="320" width="1440" height="280" fill="url(#glow)"/>

  <!-- estrellas / luces lejanas -->
  <g fill="#9FB4C7" opacity="0.5">
    <circle cx="180" cy="70" r="1.6"/><circle cx="430" cy="48" r="1.2"/><circle cx="690" cy="90" r="1.6"/>
    <circle cx="980" cy="60" r="1.2"/><circle cx="1180" cy="100" r="1.6"/><circle cx="1320" cy="54" r="1.2"/>
  </g>

  <!-- luna -->
  <circle cx="1240" cy="120" r="46" fill="#F3F4F6" opacity="0.9"/>
  <circle cx="1222" cy="110" r="46" fill="#1B2A3A" opacity="0.9"/>

  <!-- skyline de fondo -->
  <g fill="#1E3144" opacity="0.85">
    <rect x="60" y="300" width="120" height="300"/>
    <rect x="210" y="350" width="90" height="250"/>
    <rect x="1110" y="330" width="110" height="270"/>
    <rect x="1260" y="290" width="120" height="310"/>
  </g>

  <!-- edificios principales -->
  <rect x="330" y="240" width="170" height="360" fill="url(#bldA)"/>
  <rect x="520" y="180" width="150" height="420" fill="url(#bldB)"/>
  <rect x="690" y="300" width="150" height="300" fill="url(#bldA)"/>
  <rect x="860" y="150" width="160" height="450" fill="url(#bldB)"/>

  <!-- edificio en construcción (estructura) -->
  <g stroke="#3A4D60" stroke-width="4" fill="none">
    <rect x="1030" y="230" width="150" height="370"/>
    <line x1="1030" y1="290" x2="1180" y2="290"/>
    <line x1="1030" y1="350" x2="1180" y2="350"/>
    <line x1="1030" y1="410" x2="1180" y2="410"/>
    <line x1="1030" y1="470" x2="1180" y2="470"/>
    <line x1="1030" y1="530" x2="1180" y2="530"/>
    <line x1="1080" y1="230" x2="1080" y2="600"/>
    <line x1="1130" y1="230" x2="1130" y2="600"/>
  </g>

  <!-- ventanas iluminadas -->
  <g fill="#FBBF24" opacity="0.85">
    <rect x="356" y="270" width="18" height="22"/><rect x="396" y="270" width="18" height="22"/><rect x="436" y="330" width="18" height="22"/>
    <rect x="548" y="220" width="16" height="20"/><rect x="588" y="280" width="16" height="20"/><rect x="628" y="220" width="16" height="20"/>
    <rect x="892" y="200" width="18" height="22"/><rect x="952" y="260" width="18" height="22"/><rect x="892" y="320" width="18" height="22"/>
  </g>
  <g fill="#84CC16" opacity="0.85">
    <rect x="396" y="330" width="18" height="22"/><rect x="548" y="340" width="16" height="20"/>
    <rect x="952" y="200" width="18" height="22"/><rect x="716" y="340" width="16" height="20"/>
  </g>

  <!-- grúa torre -->
  <g stroke="#84CC16" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="1255" y1="600" x2="1255" y2="160"/>
    <line x1="1150" y1="185" x2="1360" y2="185"/>
    <line x1="1255" y1="160" x2="1180" y2="185"/>
    <line x1="1255" y1="160" x2="1330" y2="185"/>
    <line x1="1180" y1="185" x2="1180" y2="225"/>
  </g>
  <rect x="1170" y="225" width="22" height="16" fill="#84CC16"/>
</svg>
