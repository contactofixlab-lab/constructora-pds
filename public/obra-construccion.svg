<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Edificio en construcción">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE3F2"/>
      <stop offset="1" stop-color="#EEF4F8"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D7DCE2"/>
      <stop offset="1" stop-color="#B9C1CA"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky2)"/>
  <circle cx="660" cy="110" r="56" fill="#FCD34D" opacity="0.85"/>

  <!-- edificio terminado de fondo -->
  <rect x="60" y="200" width="150" height="400" fill="#AEB8C2"/>
  <g fill="#8C97A3">
    <rect x="80" y="230" width="26" height="30"/><rect x="124" y="230" width="26" height="30"/><rect x="168" y="230" width="26" height="30"/>
    <rect x="80" y="290" width="26" height="30"/><rect x="124" y="290" width="26" height="30"/><rect x="168" y="290" width="26" height="30"/>
    <rect x="80" y="350" width="26" height="30"/><rect x="124" y="350" width="26" height="30"/><rect x="168" y="350" width="26" height="30"/>
  </g>

  <!-- estructura de hormigón en construcción -->
  <g fill="url(#slab)" stroke="#9AA4AE" stroke-width="2">
    <!-- columnas -->
    <rect x="320" y="170" width="26" height="430"/>
    <rect x="440" y="170" width="26" height="430"/>
    <rect x="560" y="170" width="26" height="430"/>
    <!-- losas -->
    <rect x="300" y="170" width="306" height="22"/>
    <rect x="300" y="280" width="306" height="22"/>
    <rect x="300" y="390" width="306" height="22"/>
    <rect x="300" y="500" width="306" height="22"/>
  </g>

  <!-- andamios -->
  <g stroke="#C58B39" stroke-width="4" fill="none" opacity="0.9">
    <rect x="606" y="200" width="44" height="380"/>
    <line x1="606" y1="290" x2="650" y2="290"/>
    <line x1="606" y1="390" x2="650" y2="390"/>
    <line x1="606" y1="490" x2="650" y2="490"/>
    <line x1="628" y1="200" x2="628" y2="580"/>
  </g>

  <!-- grúa torre -->
  <g stroke="#5B6873" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="250" y1="600" x2="250" y2="90"/>
    <line x1="150" y1="110" x2="470" y2="110"/>
    <line x1="250" y1="90" x2="170" y2="110"/>
    <line x1="250" y1="90" x2="330" y2="110"/>
    <line x1="400" y1="110" x2="400" y2="160"/>
  </g>
  <rect x="388" y="160" width="24" height="18" fill="#84CC16"/>

  <!-- suelo -->
  <rect x="0" y="560" width="800" height="40" fill="#A2725A"/>
  <rect x="0" y="560" width="800" height="8" fill="#84CC16" opacity="0.5"/>

  <!-- casco verde (detalle) -->
  <g transform="translate(700,470)">
    <path d="M-26 18 a26 22 0 0 1 52 0 z" fill="#84CC16"/>
    <rect x="-30" y="18" width="60" height="7" rx="3" fill="#65A30D"/>
    <rect x="-4" y="-8" width="8" height="14" fill="#65A30D"/>
  </g>
</svg>
