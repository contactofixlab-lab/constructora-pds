<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Building 3D effect -->
  <!-- Front face -->
  <path d="M 60 80 L 140 80 L 140 200 L 60 200 Z" fill="#4B5563" opacity="0.9"/>

  <!-- Top face -->
  <path d="M 60 80 L 100 50 L 140 80 L 100 110 Z" fill="#5E6B7A" opacity="0.95"/>

  <!-- Right face (for 3D effect) -->
  <path d="M 140 80 L 100 110 L 100 200 L 140 200 Z" fill="#3D4553" opacity="0.85"/>

  <!-- Windows on front face - 4x4 grid -->
  <g fill="#84CC16" opacity="0.7">
    <!-- Row 1 -->
    <rect x="72" y="100" width="10" height="10"/>
    <rect x="90" y="100" width="10" height="10"/>
    <rect x="108" y="100" width="10" height="10"/>
    <rect x="126" y="100" width="10" height="10"/>
    <!-- Row 2 -->
    <rect x="72" y="120" width="10" height="10"/>
    <rect x="90" y="120" width="10" height="10"/>
    <rect x="108" y="120" width="10" height="10"/>
    <rect x="126" y="120" width="10" height="10"/>
    <!-- Row 3 -->
    <rect x="72" y="140" width="10" height="10"/>
    <rect x="90" y="140" width="10" height="10"/>
    <rect x="108" y="140" width="10" height="10"/>
    <rect x="126" y="140" width="10" height="10"/>
    <!-- Row 4 -->
    <rect x="72" y="160" width="10" height="10"/>
    <rect x="90" y="160" width="10" height="10"/>
    <rect x="108" y="160" width="10" height="10"/>
    <rect x="126" y="160" width="10" height="10"/>
  </g>

  <!-- Door -->
  <rect x="92" y="180" width="16" height="20" fill="#2D3139" opacity="0.9"/>
</svg>
