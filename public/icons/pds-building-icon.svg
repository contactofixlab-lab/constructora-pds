<svg viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" floodOpacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra base -->
  <ellipse cx="120" cy="280" rx="80" ry="15" fill="rgba(0,0,0,0.1)"/>

  <!-- Building 3D effect -->
  <!-- Front face -->
  <path d="M 50 100 L 150 100 L 150 250 L 50 250 Z" fill="#4B5563" opacity="0.95" filter="url(#shadow)"/>

  <!-- Top face (roof) -->
  <path d="M 50 100 L 100 50 L 150 100 L 100 150 Z" fill="#5E6B7A" opacity="1"/>

  <!-- Right side face (3D depth) -->
  <path d="M 150 100 L 100 150 L 100 250 L 150 250 Z" fill="#3D4553" opacity="0.9"/>

  <!-- Windows on front face - 4x5 grid with spacing -->
  <g fill="#84CC16" opacity="0.8">
    <!-- Row 1 (top floor) -->
    <rect x="62" y="115" width="12" height="12"/>
    <rect x="82" y="115" width="12" height="12"/>
    <rect x="102" y="115" width="12" height="12"/>
    <rect x="122" y="115" width="12" height="12"/>
    <rect x="142" y="115" width="12" height="12"/>
    <!-- Row 2 -->
    <rect x="62" y="138" width="12" height="12"/>
    <rect x="82" y="138" width="12" height="12"/>
    <rect x="102" y="138" width="12" height="12"/>
    <rect x="122" y="138" width="12" height="12"/>
    <rect x="142" y="138" width="12" height="12"/>
    <!-- Row 3 -->
    <rect x="62" y="161" width="12" height="12"/>
    <rect x="82" y="161" width="12" height="12"/>
    <rect x="102" y="161" width="12" height="12"/>
    <rect x="122" y="161" width="12" height="12"/>
    <rect x="142" y="161" width="12" height="12"/>
    <!-- Row 4 -->
    <rect x="62" y="184" width="12" height="12"/>
    <rect x="82" y="184" width="12" height="12"/>
    <rect x="102" y="184" width="12" height="12"/>
    <rect x="122" y="184" width="12" height="12"/>
    <rect x="142" y="184" width="12" height="12"/>
    <!-- Row 5 (ground floor) -->
    <rect x="62" y="207" width="12" height="12"/>
    <rect x="82" y="207" width="12" height="12"/>
    <rect x="102" y="207" width="12" height="12"/>
    <rect x="122" y="207" width="12" height="12"/>
    <rect x="142" y="207" width="12" height="12"/>
  </g>

  <!-- Main door -->
  <rect x="95" y="220" width="25" height="30" fill="#2D3139" opacity="0.95"/>
  <circle cx="115" cy="235" r="2" fill="#84CC16" opacity="0.6"/>
</svg>
